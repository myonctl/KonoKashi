name: Feature request
description: Propose a product outcome for roadmap or backlog consideration
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and the smallest useful outcome. Please keep
        proposals consistent with LyriFlux's local-first privacy boundary.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched the roadmap, backlog, and existing issues.
          required: true
        - label: I removed secrets and unnecessary personal information.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Explain the user outcome rather than only a proposed mechanism.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and relevant constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: product_fit
    attributes:
      label: Product fit
      description: Link related roadmap, backlog, or existing issue sections.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, security, or dependency impact
