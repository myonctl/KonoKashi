name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1
      - name: Install project and development tools
        run: python -m pip install ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: >-
          python -m mypy src scripts/build_release.py scripts/evaluate_matching.py
          scripts/prepare_flatpak.py
      - name: Tests
        run: python -m pytest
      - name: Installed CLI smoke checks
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/konokashi-ci-session-bus
        run: |
          konokashi --version
          konokashi doctor

  release-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux desktop validation runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes appstream desktop-file-utils g++ libegl1 libicu-dev pkg-config
      - name: Install release build tools
        run: python -m pip install ".[dev]"
      - name: Build and compare release artifacts
        run: python scripts/build_release.py --output-dir /tmp/konokashi-dist
      - name: Validate AppStream metadata
        run: appstreamcli validate --pedantic --no-net src/konokashi/resources/io.github.myonctl.KonoKashi.metainfo.xml
      - name: Clean-environment artifact install and lifecycle gate
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/konokashi-ci-session-bus
          XDG_CONFIG_HOME: /tmp/konokashi-fresh/config
          XDG_CACHE_HOME: /tmp/konokashi-fresh/cache
          XDG_DATA_HOME: /tmp/konokashi-fresh/data
        run: |
          python -m venv /tmp/konokashi-fresh/venv
          /tmp/konokashi-fresh/venv/bin/python -m pip install /tmp/konokashi-dist/*.whl
          /tmp/konokashi-fresh/venv/bin/konokashi --version
          /tmp/konokashi-fresh/venv/bin/konokashi doctor
          /tmp/konokashi-fresh/venv/bin/konokashi config validate
          /tmp/konokashi-fresh/venv/bin/konokashi storage migrate
          /tmp/konokashi-fresh/venv/bin/konokashi storage status
          /tmp/konokashi-fresh/venv/bin/konokashi storage backup /tmp/konokashi-fresh/backup.sqlite3
          /tmp/konokashi-fresh/venv/bin/konokashi diagnostics export --output /tmp/konokashi-fresh/diagnostics.json
          /tmp/konokashi-fresh/venv/bin/konokashi desktop-integration install
          desktop-file-validate /tmp/konokashi-fresh/data/applications/io.github.myonctl.KonoKashi.desktop
          /tmp/konokashi-fresh/venv/bin/konokashi desktop-integration status
          /tmp/konokashi-fresh/venv/bin/konokashi desktop-integration remove
          test -f /tmp/konokashi-fresh/data/konokashi/konokashi.sqlite3
          /tmp/konokashi-fresh/venv/bin/python -m pip uninstall --yes konokashi
          test -f /tmp/konokashi-fresh/data/konokashi/konokashi.sqlite3

  tracked-tree-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks version
      - name: Verify scanner and scan tracked tree
        run: |
          mkdir /tmp/konokashi-gitleaks-canary
          printf 'aws_access_key_id = "%s%s"\n' 'AKIA' 'QWERTYUIOPASDFGH' \
            > /tmp/konokashi-gitleaks-canary/canary.txt
          if /tmp/gitleaks dir /tmp/konokashi-gitleaks-canary --redact --no-banner; then
            echo "Gitleaks canary was not detected" >&2
            exit 1
          fi
          /tmp/gitleaks dir "${GITHUB_WORKSPACE}" --redact --no-banner
