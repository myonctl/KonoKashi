name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src
      - name: Tests
        run: python -m pytest
      - name: Installed CLI smoke checks
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/lyricflow-ci-session-bus
        run: |
          lyricflow --version
          lyricflow doctor
