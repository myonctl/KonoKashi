id: io.github.myonctl.KonoKashi
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: konokashi

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.mpris.MediaPlayer2.*
  - --filesystem=xdg-music:ro

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_DISABLE_NUMPY: '1'

modules:
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp
        sha256: 1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6
  - name: mecab
    buildsystem: autotools
    subdir: mecab
    config-opts:
      - --enable-utf8-only
    sources:
      - type: git
        url: https://github.com/taku910/mecab.git
        commit: 61b90ba6e669dc2d7d533d4a80d206f3b31d52b1
  - name: python3-fugashi
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-index --no-build-isolation --prefix=/app .
    sources:
      - type: git
        url: https://github.com/polm/fugashi.git
        commit: 1576b66a2bf8173da50e1930791f0dcb96111590
  - python3-dependencies.json
  - name: portal-parent-bridge
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: portal-parent-bridge
  - name: konokashi
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-deps --no-index --no-build-isolation --prefix=/app .
      - sed -e 's|@KONOKASHI_EXECUTABLE@|konokashi|' -e 's|@KONOKASHI_ICON@|io.github.myonctl.KonoKashi|' src/konokashi/resources/io.github.myonctl.KonoKashi.desktop.in > io.github.myonctl.KonoKashi.desktop
      - install -Dm644 io.github.myonctl.KonoKashi.desktop /app/share/applications/io.github.myonctl.KonoKashi.desktop
      - install -Dm644 src/konokashi/resources/io.github.myonctl.KonoKashi.svg /app/share/icons/hicolor/scalable/apps/io.github.myonctl.KonoKashi.svg
      - install -Dm644 src/konokashi/resources/io.github.myonctl.KonoKashi.metainfo.xml /app/share/metainfo/io.github.myonctl.KonoKashi.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/io.github.myonctl.KonoKashi/LICENSE
    sources:
      - type: archive
        url: https://github.com/myonctl/KonoKashi/releases/download/v0.1.0-beta.1/konokashi-0.1.0b1.tar.gz
        sha256: c0727503df631741a1ebe1d8cdb1836363eb727c1930fea0e4ce921b327734d8

cleanup-commands:
  - /app/cleanup-BaseApp.sh
