id: io.github.myonctl.LyriFlux
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: lyriflux

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.mpris.MediaPlayer2.*
  - --filesystem=xdg-music:ro

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_DISABLE_NUMPY: '1'

modules:
  - name: mecab
    buildsystem: autotools
    subdir: mecab
    config-opts:
      - --enable-utf8-only
    sources:
      - type: git
        url: https://github.com/taku910/mecab.git
        commit: 61b90ba6e669dc2d7d533d4a80d206f3b31d52b1
  - name: python3-fugashi
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-index --no-build-isolation --prefix=/app .
    sources:
      - type: git
        url: https://github.com/polm/fugashi.git
        commit: 1576b66a2bf8173da50e1930791f0dcb96111590
  - python3-dependencies.json
  - name: lyriflux
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-deps --no-index --no-build-isolation --prefix=/app .
      - sed -e 's|@LYRIFLUX_EXECUTABLE@|lyriflux|' -e 's|@LYRIFLUX_ICON@|io.github.myonctl.LyriFlux|' src/lyriflux/resources/io.github.myonctl.LyriFlux.desktop.in > io.github.myonctl.LyriFlux.desktop
      - install -Dm644 io.github.myonctl.LyriFlux.desktop /app/share/applications/io.github.myonctl.LyriFlux.desktop
      - install -Dm644 src/lyriflux/resources/io.github.myonctl.LyriFlux.svg /app/share/icons/hicolor/scalable/apps/io.github.myonctl.LyriFlux.svg
      - install -Dm644 src/lyriflux/resources/io.github.myonctl.LyriFlux.metainfo.xml /app/share/metainfo/io.github.myonctl.LyriFlux.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .maintainer-private
          - .release-readiness-work
          - .venv
          - build
          - dist
          - '*.egg-info'
          - __pycache__

cleanup-commands:
  - /app/cleanup-BaseApp.sh
